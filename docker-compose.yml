version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: silverland-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-silverland_crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-silverland_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisSuperSecretPassword123!}
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-silverland_admin} -d ${POSTGRES_DB:-silverland_crm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: SilverlandCRM.API/Dockerfile
    container_name: silverland-backend-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGIN}
    ports:
      - "${PORT_BACKEND:-5000}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: silverland-frontend-ui
    restart: always
    depends_on:
      - backend
    ports:
      - "${PORT_FRONTEND:-5173}:80"

volumes:
  postgres_data:
