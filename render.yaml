services:
  - type: web
    name: silverland-crm-api
    env: docker
    dockerfilePath: backend/SilverlandCRM.API/Dockerfile
    dockerContext: backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: SilverlandCRM
      - key: Jwt__Audience
        value: SilverlandClients
      - key: Cors__AllowedOrigins
        value: https://silverland-crm.onrender.com,http://localhost:5173

  - type: web
    name: silverland-crm
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    plan: free
